name: Bootstrap Garmin Session
on:
  workflow_dispatch:
    inputs:
      garmin_tokens_base64:
        description: "Base64-encoded content of garmin_tokens.json (local session)"
        required: true

permissions:
  actions: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Create session directory
        run: mkdir -p session/garmin_session

      - name: Decode and write garmin tokens
        run: |
          echo "${{ inputs.garmin_tokens_base64 }}" | base64 -d > session/garmin_session/garmin_tokens.json
          echo "::add-mask::${{ inputs.garmin_tokens_base64 }}"

      - name: Validate JSON
        run: |
          python3 -c "import json; json.load(open('session/garmin_session/garmin_tokens.json'))"
          echo "JSON válido"

      - name: Upload Garmin session artifact
        uses: actions/upload-artifact@v4
        with:
          name: garmin-session
          path: session/garmin_session
          overwrite: true
          if-no-files-found: error
