name: Garmin Daily Sync

on:
  schedule:
    # Ejecutar una vez al día a las 10:00 UTC (12:00 España, UTC+2)
    - cron: "0 10 * * *"
  workflow_dispatch:
    # Permitir ejecución manual

permissions:
  actions: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Get last successful run ID
        id: last-run
        uses: actions/github-script@v7
        with:
          script: |
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'garmin-sync.yml',
              status: 'success',
              per_page: 10
            });

            const currentRunId = context.runId;
            const previousRun = runs.workflow_runs.find(run => run.id !== currentRunId);

            if (previousRun) {
              console.log(`Found previous successful run: ${previousRun.id}`);
              return previousRun.id;
            } else {
              console.log('No previous successful run found (bootstrap)');
              return '';
            }
          result-encoding: string

      - name: Download Garmin session artifact
        if: steps.last-run.outputs.result != ''
        uses: actions/download-artifact@v4
        with:
          name: garmin-session
          path: session/garmin_session
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.last-run.outputs.result }}
        continue-on-error: true

      - name: Run Garmin sync
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          USER_ID: ${{ secrets.USER_ID }}
        run: |
          python sync_garmin.py --days 7

      - name: Upload Garmin session artifact
        uses: actions/upload-artifact@v4
        with:
          name: garmin-session
          path: session/garmin_session
          if-no-files-found: error
          overwrite: true